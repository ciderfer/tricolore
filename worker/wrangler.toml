name = "tricolore"
main = "index.js"
compatibility_date = "2026-05-01"
account_id = "07474c841454930c64f4fd78088ca948"
workers_dev = true

# Une seule minuterie, chaque minute (les comptes gratuits ont 5 minuteries en tout), voir scheduled() dans index.js :
# - aux 15 minutes (minute % 15 === 0, heure UTC), lance la tâche « Données LNH », comme l'ancien « */15 * * * * »;
# - chaque minute, regarde l'état du match du Canadien et envoie les alertes de match (alertes.js).
[triggers]
crons = ["* * * * *"]

# Alertes de match : abonnements et état des envois (alertes.js). Namespace « ALERTES » créé le 2026-10-20
# (`npx wrangler kv namespace create ALERTES`). En local, `wrangler dev` utilise un KV local, pas celui-ci.
# Secrets à ajouter (`npx wrangler secret put …`) : VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT (mailto:…).
[[kv_namespaces]]
binding = "ALERTES"
id = "5e428b1d7fb84d7c9e68bfb36e7e3581"

# Limiteur de débit (voir fetch() dans index.js) : 300 requêtes par minute par adresse IP.
# Le compteur est approximatif et propre à chaque centre de données Cloudflare.
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 300
  period = 60

# Direct (direct.js) : un Durable Object par match pousse le pointage par WebSocket à tous les partisans.
# Plan gratuit : seulement les objets « SQLite » (new_sqlite_classes). 100 000 requêtes par jour, à part du Worker.
[[durable_objects.bindings]]
name = "DIRECT"
class_name = "Direct"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Direct"]

# Envoi (envoi.js) : la suite des alertes au-delà du premier lot de la minuterie, un lot par alarme
# (chaque alarme a ses propres 50 sous-requêtes). Un seul objet.
[[durable_objects.bindings]]
name = "ENVOI"
class_name = "Envoi"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Envoi"]
