name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Toujours la pointe de main, pour inclure un commit de données tout juste poussé.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Préparer le site
        run: |
          mkdir _site
          cp -r *.html *.js *.css fonts data _site/
          # Version des JS et CSS tirée de leur contenu (pas du commit : les données changent aux 15 min).
          # GitHub Pages met max-age=600 : sans version, un iPhone pourrait garder l'ancien JS avec le nouveau HTML.
          V=$(cat *.js *.css | sha256sum | cut -c1-8)
          sed -i -E "s/(src|href)=\"([a-z]+\.(js|css))\"/\1=\"\2?v=$V\"/g" _site/*.html
          # Vérification : échoue (et ne déploie pas) si aucune version n'a été ajoutée.
          grep -oE '"[a-z]+\.(js|css)\?v=[0-9a-f]{8}"' _site/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Icônes, manifeste (écran d’accueil), robots.txt et sitemap.xml
        run: cp -r manifest.webmanifest icons robots.txt sitemap.xml _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
