name: Tests

# Tests du site et du Worker à chaque push et pull request. Ne déploie rien.
# Les commits de données (data.yml) sont poussés avec GITHUB_TOKEN : ils ne déclenchent pas ce workflow.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Tests du site
        run: node --test tests/*.test.mjs

      # Les tests du Worker n'utilisent que Node (pas wrangler) : aucun npm ci.
      - name: Tests du Worker
        working-directory: worker
        run: npm test
