name: Données LNH

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donnees-lnh
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les données
        run: node scripts/fetch-data.mjs

      - name: Committer data/ si modifié
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Aucun changement."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "données: mise à jour LNH"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Un push fait avec GITHUB_TOKEN ne déclenche pas d'autre workflow :
  # on redéploie donc explicitement le site quand les données changent.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
