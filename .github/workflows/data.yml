name: Données LNH

on:
  # Déclencheur principal : la minuterie du Worker Cloudflare (worker/) aux 15 minutes.
  # L'horaire de GitHub reste en filet de sécurité, hors des minutes chargées (:00, :15, :30, :45).
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donnees-lnh
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Récupérer les données
        run: node scripts/fetch-data.mjs

      # Blessés (API non officielle d'ESPN) : un échec ne doit jamais bloquer les données LNH.
      # En cas d'échec, le script écrit « données indisponibles » (players null); le commit ci-dessous (git add data) l'inclut.
      - name: Récupérer les blessés (ESPN)
        continue-on-error: true
        timeout-minutes: 1
        run: node scripts/fetch-injuries.mjs

      - name: Committer data/ si modifié
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Aucun changement."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "données: mise à jour LNH"
          # Si main a bougé pendant la tâche (commit manuel), on se replace par-dessus au lieu d'échouer.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Un push fait avec GITHUB_TOKEN ne déclenche pas d'autre workflow :
  # on redéploie donc explicitement le site quand les données changent.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
